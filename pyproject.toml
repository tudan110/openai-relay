[project]
name = "openai-relay"
version = "4.0.0"
description = "OpenAI-compatible multi-user relay with quotas and usage accounting"
requires-python = ">=3.10"
dependencies = []          # pure standard library — no third-party deps

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]          # long lines tolerated (log/HTML strings)

[tool.pytest.ini_options]
testpaths = ["tests"]
